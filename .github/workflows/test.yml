# Checks that every design system's test page still works, and reports each one's measurements.
#
# The design systems here are what the tests measure, not code this repo can fix, so the
# measurements don't fail the run. A page that breaks, such as a dropdown that no longer opens, does.
name: Test design systems

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "folders=$(ls -d design-systems/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  test:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.list.outputs.folders) }}
    env:
      # The tests use Playwright's Chrome, so skip the one the comparison script downloads.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: echo "### ${{ matrix.folder }}" >> "$GITHUB_STEP_SUMMARY"
      - run: npx playwright test design-systems/${{ matrix.folder }}
        env:
          REPORT_ONLY: "1"
